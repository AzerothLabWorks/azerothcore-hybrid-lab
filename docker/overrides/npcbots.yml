services:
  ac-worldserver:
    build:
      context: .
      target: worldserver
      dockerfile: apps/docker/Dockerfile
    volumes:
      - ./modules:/azerothcore/modules
    environment:
      TZ: "America/Los_Angeles"

  ac-authserver:
    build:
      context: .
      target: authserver
      dockerfile: apps/docker/Dockerfile

  ac-db-import:
    build:
      context: .
      target: db-import
      dockerfile: apps/docker/Dockerfile

  ac-client-data-init:
    build:
      context: .
      target: client-data
      dockerfile: apps/docker/Dockerfile
