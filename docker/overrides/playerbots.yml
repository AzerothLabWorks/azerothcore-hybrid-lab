services:
  ac-worldserver:
    build:
      context: .
      target: worldserver
      dockerfile: apps/docker/Dockerfile
    volumes:
      - ./modules:/azerothcore/modules
    environment:
      AC_PLAYERBOTS_UPDATES_ENABLE_DATABASES: "1"
      AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN: "1"
      AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: "50"
      AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: "200"
      AC_AI_PLAYERBOT_RANDOM_BOT_JOIN_LFG: "1"
      AC_AI_PLAYERBOT_APPLY_INSTANCE_STRATEGIES: "1"
      AC_AI_PLAYERBOT_AUTO_AVOID_AOE: "1"
      AC_AI_PLAYERBOT_AUTO_GREATER_BLESSINGS: "1"
      AC_AI_PLAYERBOT_AUTO_PARTY_BUFFS: "2"
      AC_AI_PLAYERBOT_SUMMON_WHEN_GROUP: "1"

  ac-authserver:
    build:
      context: .
      target: authserver
      dockerfile: apps/docker/Dockerfile

  ac-db-import:
    build:
      context: .
      target: db-import
      dockerfile: apps/docker/Dockerfile

  ac-client-data-init:
    build:
      context: .
      target: client-data
      dockerfile: apps/docker/Dockerfile
